# Everything goes through the web service (nginx serves the app and proxies /api, including websockets).
# Written for ingress-nginx; the annotations raise its defaults (1 MB bodies, 60 s timeouts), which would break
# project uploads, long AI requests and the collaboration websocket.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openprism
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"          # server-sent events (arXiv import) must stream
    # cert-manager.io/cluster-issuer: letsencrypt                # uncomment (and set `tls`) to get certificates automatically
spec:
  ingressClassName: nginx
  rules:
    - host: openprism.example.com        # overlay: your host
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
  # tls:
  #   - hosts: [openprism.example.com]
  #     secretName: openprism-tls
