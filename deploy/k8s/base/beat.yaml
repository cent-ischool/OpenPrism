# Celery beat: the scheduler (reaps stuck jobs, deletes old ones, expires invites). Exactly one replica, ever: two
# would schedule every task twice, so updates replace the pod instead of surging.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  labels: {app.kubernetes.io/name: beat}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: beat}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beat
        openprism.io/data: "true"
    spec:
      serviceAccountName: openprism-app
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-for-migrations
          image: openprism/api
          command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'waiting for database migrations'; sleep 3; done"]
          envFrom: [{configMapRef: {name: openprism-config}}, {secretRef: {name: openprism-core}}]
          securityContext: &locked {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
      containers:
        - name: beat
          image: openprism/api
          args: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
          envFrom: [{configMapRef: {name: openprism-config}}, {secretRef: {name: openprism-core}}]
          securityContext: *locked
          resources: {requests: {cpu: 20m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
