apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace here: overlays choose it. Secrets are not part of the base (see secrets.example.yaml).
resources:
  - configmap.yaml
  - api.yaml
  - web.yaml
  - worker-compile.yaml
  - worker-transfer.yaml
  - worker-ai.yaml
  - beat.yaml
  - migrate-job.yaml
  - ingress.yaml
  - networkpolicies.yaml
labels:
  - pairs: {app.kubernetes.io/part-of: openprism}
    includeSelectors: false
images:   # overlays pin real registries and tags
  - {name: openprism/api, newTag: latest}
  - {name: openprism/web, newTag: latest}
  - {name: openprism/worker-tex, newTag: latest}
  - {name: openprism/worker-ai, newTag: latest}
