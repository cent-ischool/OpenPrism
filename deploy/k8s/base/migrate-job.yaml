# Database migrations, run once per release before the new pods start serving (deploy.sh waits for it; Argo CD /
# Flux users: the PreSync hook below runs it first). A Job's pod template is immutable, so deploy.sh deletes the old
# Job before applying a new one.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        openprism.io/data: "true"
    spec:
      serviceAccountName: openprism-app
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: openprism/api
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom: [{configMapRef: {name: openprism-config}}, {secretRef: {name: openprism-core}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 512Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
