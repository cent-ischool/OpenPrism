apiVersion: v1
kind: ServiceAccount
metadata:
  name: openprism-app
automountServiceAccountToken: false   # nothing here talks to the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: api}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        openprism.io/data: "true"       # may reach Postgres / Redis / object storage
        openprism.io/internet: "true"   # arXiv search/bibtex run inline in the API
    spec:
      serviceAccountName: openprism-app
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: api}}}
      initContainers:
        - name: wait-for-migrations
          image: openprism/api
          command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'waiting for database migrations'; sleep 3; done"]
          envFrom: [{configMapRef: {name: openprism-config}}, {secretRef: {name: openprism-core}}]
          securityContext: &locked {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
      containers:
        - name: api
          image: openprism/api
          command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "30"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: openprism-config}}, {secretRef: {name: openprism-core}}]
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, failureThreshold: 40}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
          # /readyz checks Postgres, Redis and S3: a pod that cannot reach them is taken out of rotation, not restarted.
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 2}
          lifecycle: {preStop: {exec: {command: ["sleep", "5"]}}}   # let the endpoint removal propagate before SIGTERM
          securityContext: *locked
          resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
