# Compiles LaTeX for untrusted users. It runs user-supplied documents, so it is the most locked-down pod: no internet
# egress (see networkpolicies.yaml), no LLM credentials, a scrubbed child environment, and memory/CPU limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-compile
  labels: {app.kubernetes.io/name: worker-compile}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: worker-compile}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-compile
        openprism.io/data: "true"
    spec:
      serviceAccountName: openprism-app
      # SIGTERM starts a warm shutdown: Celery finishes the running task. Allow longer than the task's hard time limit
      # (330s), or a rolling update would kill a job part-way through.
      terminationGracePeriodSeconds: 360
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: worker-compile}}}
      initContainers:
        - name: wait-for-migrations
          image: openprism/worker-tex
          command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'waiting for database migrations'; sleep 3; done"]
          envFrom: [{configMapRef: {name: openprism-config}}, {secretRef: {name: openprism-core}}]
          securityContext: &locked {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
      containers:
        - name: worker
          image: openprism/worker-tex
          args: ["celery", "-A", "config", "worker", "-Q", "compile", "-l", "info", "--concurrency", "2", "--hostname", "worker-compile@%h"]
          envFrom:
            - configMapRef: {name: openprism-config}
            - secretRef: {name: openprism-core}
          env:
            - {name: HOME, value: /tmp}
          # Celery answers a broadcast ping when the worker is alive and connected to the broker.
          livenessProbe:
            exec: {command: ["sh", "-c", "celery -A config inspect ping -d worker-compile@$HOSTNAME"]}
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          securityContext: *locked
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 2Gi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 2Gi}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: worker-compile}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: worker-compile}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
