# A local cluster: one control plane that also serves the ingress on host port 8088, plus one worker.
# NetworkPolicies are enforced by the CNI installed by kind-up.sh (kind's default one does not enforce them).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 8088, protocol: TCP}
  - role: worker
