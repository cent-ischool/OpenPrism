# Optional: scale the Celery workers on how many tasks are waiting in their queues, which is a better signal than CPU
# for work that mostly waits on LLM providers. Needs KEDA (https://keda.sh) installed in the cluster. Replaces the
# CPU-based HorizontalPodAutoscalers of the three worker Deployments.
#
# Note: this component has only been rendered, never applied to a cluster.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - scaledobjects.yaml
patches:
  - target: {kind: HorizontalPodAutoscaler, name: worker-compile}
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: {name: worker-compile}
  - target: {kind: HorizontalPodAutoscaler, name: worker-transfer}
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: {name: worker-transfer}
  - target: {kind: HorizontalPodAutoscaler, name: worker-ai}
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: {name: worker-ai}
