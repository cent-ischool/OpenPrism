# KEDA reads the length of each Celery queue (a Redis list named after the queue) from the same Redis the app uses.
# REDIS_URL's host/port are given below; the password (if any) comes from the openprism-core secret.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: {name: openprism-redis}
spec:
  secretTargetRef:
    - {parameter: password, name: openprism-core, key: REDIS_PASSWORD}   # optional: add this key if Redis needs a password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: worker-compile}
spec:
  scaleTargetRef: {name: worker-compile}
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300      # scale in slowly: a worker may be in the middle of a long job
  triggers:
    - type: redis
      metadata: {address: "redis:6379", listName: compile, listLength: "4"}   # CHANGE ME: your Redis host:port
      authenticationRef: {name: openprism-redis}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: worker-transfer}
spec:
  scaleTargetRef: {name: worker-transfer}
  minReplicaCount: 1
  maxReplicaCount: 4
  cooldownPeriod: 300      # scale in slowly: a worker may be in the middle of a long job
  triggers:
    - type: redis
      metadata: {address: "redis:6379", listName: transfer, listLength: "2"}   # CHANGE ME: your Redis host:port
      authenticationRef: {name: openprism-redis}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: worker-ai}
spec:
  scaleTargetRef: {name: worker-ai}
  minReplicaCount: 2
  maxReplicaCount: 6
  cooldownPeriod: 300      # scale in slowly: a worker may be in the middle of a long job
  triggers:
    - type: redis
      metadata: {address: "redis:6379", listName: ai, listLength: "6"}   # CHANGE ME: your Redis host:port
      authenticationRef: {name: openprism-redis}
