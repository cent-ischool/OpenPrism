# Single-node Garage (S3-compatible object storage) for local clusters. Production: any managed S3, with its endpoint
# and credentials set through the production overlay and the openprism-core secret.
apiVersion: v1
kind: ConfigMap
metadata: {name: garage-config}
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"
    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: garage}
spec:
  serviceName: garage
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: garage}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: garage, openprism.io/data-service: "true"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: garage
          image: dxflrs/garage:v1.0.1
          args: ["/garage", "server"]
          ports: [{name: s3, containerPort: 3900}, {name: admin, containerPort: 3903}]
          envFrom: [{secretRef: {name: garage-credentials}}]
          readinessProbe: {tcpSocket: {port: s3}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: s3}, initialDelaySeconds: 10, periodSeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/garage}
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true}
      volumes: [{name: config, configMap: {name: garage-config}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: garage}
spec:
  selector: {app.kubernetes.io/name: garage}
  ports: [{name: s3, port: 3900, targetPort: s3}, {name: admin, port: 3903, targetPort: admin}]
