# One-time, idempotent storage setup through Garage's admin API: cluster layout, the bucket, the access key and its
# permissions (the same steps as deploy/garage-init.sh for docker compose).
apiVersion: v1
kind: ConfigMap
metadata: {name: garage-init-script}
data:
  init.py: |
    import json, os, sys, time, urllib.error, urllib.request

    ADMIN = os.environ.get('GARAGE_ADMIN_URL', 'http://garage:3903')
    TOKEN = os.environ['GARAGE_ADMIN_TOKEN']
    BUCKET = os.environ['S3_BUCKET']
    KEY_ID, SECRET = os.environ['S3_ACCESS_KEY_ID'], os.environ['S3_SECRET_ACCESS_KEY']

    def call(method, path, body=None, ok=(200,)):
        req = urllib.request.Request(ADMIN + path, method=method, data=json.dumps(body).encode() if body is not None else None,
                                     headers={'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json'})
        try:
            with urllib.request.urlopen(req, timeout=20) as r:
                raw = r.read()
                return r.status, (json.loads(raw) if raw else None)
        except urllib.error.HTTPError as e:
            if e.code in ok:
                return e.code, None
            sys.exit(f'{method} {path} -> {e.code}: {e.read().decode()}')

    for _ in range(60):                       # wait for Garage to accept admin calls
        try:
            _, status = call('GET', '/v1/status'); break
        except Exception:
            time.sleep(2)
    else:
        sys.exit('Garage did not become ready')

    _, layout = call('GET', '/v1/layout')
    if not layout['roles']:
        call('POST', '/v1/layout', [{'id': status['node'], 'zone': 'dc1', 'capacity': 1 << 30, 'tags': []}])
        call('POST', '/v1/layout/apply', {'version': layout['version'] + 1})
        print('layout applied')

    code, bucket = call('GET', f'/v1/bucket?globalAlias={BUCKET}', ok=(404,))
    if code == 404:
        _, bucket = call('POST', '/v1/bucket', {'globalAlias': BUCKET})
        print('bucket created')

    code, _ = call('GET', f'/v1/key?id={KEY_ID}', ok=(404,))
    if code == 404:
        call('POST', '/v1/key/import', {'accessKeyId': KEY_ID, 'secretAccessKey': SECRET, 'name': 'openprism'})
        print('key imported')

    call('POST', '/v1/bucket/allow', {'bucketId': bucket['id'], 'accessKeyId': KEY_ID,
                                     'permissions': {'read': True, 'write': True, 'owner': True}})
    print(f'Garage ready: bucket={BUCKET} key={KEY_ID}')
---
apiVersion: batch/v1
kind: Job
metadata: {name: garage-init}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: garage-init, openprism.io/garage-admin: "true"}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: init
          image: python:3.12-slim
          command: ["python", "/script/init.py"]
          env:
            - {name: S3_BUCKET, valueFrom: {configMapKeyRef: {name: openprism-config, key: S3_BUCKET}}}
            - {name: S3_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: openprism-core, key: S3_ACCESS_KEY_ID}}}
            - {name: S3_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: openprism-core, key: S3_SECRET_ACCESS_KEY}}}
            - {name: GARAGE_ADMIN_TOKEN, valueFrom: {secretKeyRef: {name: garage-credentials, key: GARAGE_ADMIN_TOKEN}}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 128Mi}}
          volumeMounts: [{name: script, mountPath: /script, readOnly: true}]
      volumes: [{name: script, configMap: {name: garage-init-script}}]
