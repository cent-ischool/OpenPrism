# Who may talk to the data services, and the one-off Garage setup job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: data-services-ingress}
spec:
  podSelector: {matchLabels: {openprism.io/data-service: "true"}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {openprism.io/data: "true"}}}]
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 6379}, {protocol: TCP, port: 3900}]
    - from: [{podSelector: {matchLabels: {openprism.io/garage-admin: "true"}}}]
      ports: [{protocol: TCP, port: 3903}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: garage-init-egress}
spec:
  podSelector: {matchLabels: {openprism.io/garage-admin: "true"}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: garage}}}]
      ports: [{protocol: TCP, port: 3903}]
