apiVersion: forge/v1

# The Django API (apps/api). Its Dockerfile's last stage is `api`, which is what a plain build produces.
# The React/nginx `web` image and the TeX/AI Celery workers have their own Dockerfile stages and are not
# part of this contract yet.
build:
  context: apps/api
  dockerfile: Dockerfile

services:
  api:
    image: openprism-api
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    port: 8000
    expose: true
    healthcheck:
      path: /healthz
    envFromSecret: forge-object-storage
    env:
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_BEHIND_TLS_PROXY: "1"
      TRUSTED_PROXY_COUNT: "2"

database:
  engine: postgres
  version: "16"
  storage: 5Gi

cache:
  engine: redis
  storage: 1Gi

objectStorage:
  default: openprism
  buckets:
    openprism: {}

migrations:
  command: ["python", "manage.py", "migrate", "--noinput"]

tests:
  django:
    image: python:3.12-slim
    setup:
      - pip install --no-cache-dir -r apps/api/requirements.txt "moto[server]"
    # Garage needs a layout step that a suite service cannot do, so the suite uses a moto S3 server on :3900
    # (the API only needs a path-style S3 endpoint and the bucket). LaTeX and plot tests skip without TeX/matplotlib.
    command:
      - sh
      - -c
      - |
        set -e
        export DATABASE_URL="postgres://openprism:notasecret@${DATABASE_HOST}:5432/openprism"
        export REDIS_URL="redis://${REDIS_HOST}:6379/0"
        export S3_ENDPOINT_URL=http://127.0.0.1:3900
        export S3_BUCKET=openprism S3_REGION=garage
        export S3_ACCESS_KEY_ID=testing S3_SECRET_ACCESS_KEY=testing
        moto_server -H 127.0.0.1 -p 3900 >/tmp/moto.log 2>&1 &
        python - <<'PY'
        import time, boto3
        from botocore.config import Config
        s3 = boto3.client('s3', endpoint_url='http://127.0.0.1:3900', region_name='garage',
                          aws_access_key_id='testing', aws_secret_access_key='testing',
                          config=Config(s3={'addressing_style': 'path'}))
        for _ in range(60):
            try:
                s3.create_bucket(Bucket='openprism')
                break
            except Exception:
                time.sleep(1)
        else:
            raise SystemExit('moto S3 server did not start')
        PY
        cd apps/api
        python manage.py test --noinput
    services:
      database:
        image: postgres:16-alpine
        port: 5432
        hostEnv: DATABASE_HOST
        env:
          POSTGRES_DB: openprism
          POSTGRES_USER: openprism
          POSTGRES_PASSWORD: notasecret
      cache:
        image: redis:7-alpine
        port: 6379
        hostEnv: REDIS_HOST
