apiVersion: forge/v1

# Every process compose.yaml runs, as compose runs it. compose's postgres, redis and garage become the platform's
# own `database`, `cache` and `objectStorage` below; the devcontainer (docker-in-docker) is the dev shell, not a
# service.
#
# Four images, as compose builds them: three stages of apps/api/Dockerfile and the nginx frontend, which builds
# from the repo root because it imports the shared /design package.
build:                      # api and beat: the `api` stage
  context: apps/api
  dockerfile: Dockerfile
  target: api
builds:
  tex:                      # the TeX Live worker (queues compile, transfer)
    context: apps/api
    dockerfile: Dockerfile
    target: tex
  ai:                       # the LLM/plotting worker (queues ai, import)
    context: apps/api
    dockerfile: Dockerfile
    target: ai
  web:                      # the built SPA behind nginx, proxying /api to `api`
    dockerfile: apps/frontend/Dockerfile

services:
  # The URL. nginx serves the SPA and proxies /api (and the collaboration websocket) to http://api:8000, which is
  # this contract's `api` service by name.
  web:
    build: web
    port: 8080
    expose: true
    healthcheck:
      path: /healthz

  api:
    command: ["sh", "forge-entrypoint.sh", "uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    port: 8000
    healthcheck:
      path: /healthz
    envFromSecret: forge-object-storage
    env: &api-env
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_BEHIND_TLS_PROXY: "1"
      TRUSTED_PROXY_COUNT: "2"   # the ingress, then nginx

  # The workers have no port and no probe (the contract's health checks are HTTP); a crash restarts the pod.
  # OPENPRISM_LLM_* and OPENPRISM_MINERU_TOKEN are not set here: the AI and import features need them added as
  # app variables (`secrets:` on worker-ai, worker-tex and api).
  worker-tex:
    build: tex
    command: ["sh", "forge-entrypoint.sh", "celery", "-A", "config", "worker", "-Q", "compile,transfer", "-l", "info", "--concurrency", "2"]
    envFromSecret: forge-object-storage
    env: *api-env
    resources:
      memory: 1Gi

  worker-ai:
    build: ai
    command: ["sh", "forge-entrypoint.sh", "celery", "-A", "config", "worker", "-Q", "ai,import", "-l", "info", "--concurrency", "4"]
    envFromSecret: forge-object-storage
    env: *api-env

  beat:
    command: ["sh", "forge-entrypoint.sh", "celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    envFromSecret: forge-object-storage
    env: *api-env

database:
  engine: postgres
  version: "16"
  storage: 5Gi

cache:
  engine: redis
  storage: 1Gi

objectStorage:
  default: openprism
  buckets:
    openprism: {}

migrations:
  build: default            # the api image; the exposed service is nginx
  command: ["sh", "forge-entrypoint.sh", "python", "manage.py", "migrate", "--noinput"]

tests:
  django:
    image: python:3.12-slim
    setup:
      - pip install --no-cache-dir -r apps/api/requirements.txt "moto[server]"
    # Garage needs a layout step that a suite service cannot do, so the suite uses a moto S3 server on :3900
    # (the API only needs a path-style S3 endpoint and the bucket). LaTeX and plot tests skip without TeX/matplotlib.
    command:
      - sh
      - -c
      - |
        set -e
        # The suite runs as a non-root user, so pip's `setup` installed moto_server into ~/.local/bin.
        export PATH="$HOME/.local/bin:$PATH"
        export DATABASE_URL="postgres://openprism:notasecret@${DATABASE_HOST}:5432/openprism"
        export REDIS_URL="redis://${REDIS_HOST}:6379/0"
        export S3_ENDPOINT_URL=http://127.0.0.1:3900
        export S3_BUCKET=openprism S3_REGION=garage
        export S3_ACCESS_KEY_ID=testing S3_SECRET_ACCESS_KEY=testing
        moto_server -H 127.0.0.1 -p 3900 >/tmp/moto.log 2>&1 &
        python - <<'PY'
        import time, boto3
        from botocore.config import Config
        s3 = boto3.client('s3', endpoint_url='http://127.0.0.1:3900', region_name='garage',
                          aws_access_key_id='testing', aws_secret_access_key='testing',
                          config=Config(s3={'addressing_style': 'path'}))
        for _ in range(60):
            try:
                s3.create_bucket(Bucket='openprism')
                break
            except Exception:
                time.sleep(1)
        else:
            raise SystemExit('moto S3 server did not start')
        PY
        cd apps/api
        python manage.py test --noinput
    services:
      database:
        image: postgres:16-alpine
        port: 5432
        hostEnv: DATABASE_HOST
        env:
          POSTGRES_DB: openprism
          POSTGRES_USER: openprism
          POSTGRES_PASSWORD: notasecret
      cache:
        image: redis:7-alpine
        port: 6379
        hostEnv: REDIS_HOST
